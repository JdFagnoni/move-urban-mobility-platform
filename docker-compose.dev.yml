version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-move}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-move_secret}
      POSTGRES_DB: ${POSTGRES_DB:-move_platform}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pg_data_dev:/var/lib/postgresql/data

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
      target: dev
    ports:
      - "${API_GATEWAY_PORT:-3000}:3000"
    volumes:
      - ./api-gateway/src:/app/api-gateway/src
    environment:
      NODE_ENV: development
      RESERVAS_SERVICE_URL: ${RESERVAS_SERVICE_URL:-http://reservas-service:3001}
      TRASLADOS_SERVICE_URL: ${TRASLADOS_SERVICE_URL:-http://traslados-service:3002}
      AUTH0_DOMAIN: ${AUTH0_DOMAIN:-}
      AUTH0_AUDIENCE: ${AUTH0_AUDIENCE:-https://move-platform-api}
    depends_on:
      - reservas-service
      - traslados-service

  reservas-service:
    build:
      context: .
      dockerfile: reservas-service/Dockerfile
      target: dev
    ports:
      - "${RESERVAS_SERVICE_PORT:-3001}:3001"
    volumes:
      - ./reservas-service/src:/app/reservas-service/src
    environment:
      NODE_ENV: development
      DATABASE_URL: ${DATABASE_URL:-postgres://move:move_secret@postgres:5432/move_platform}
      AUTH0_DOMAIN: ${AUTH0_DOMAIN:-}
      AUTH0_AUDIENCE: ${AUTH0_AUDIENCE:-https://move-platform-api}
      AUTH0_DB_CONNECTION: ${AUTH0_DB_CONNECTION:-Username-Password-Authentication}
      AUTH0_MGMT_CLIENT_ID: ${AUTH0_MGMT_CLIENT_ID:-}
      AUTH0_MGMT_CLIENT_SECRET: ${AUTH0_MGMT_CLIENT_SECRET:-}
      BOOTSTRAP_ADMIN_AUTH_SUBJECT: ${BOOTSTRAP_ADMIN_AUTH_SUBJECT:-}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_NAME: ${BOOTSTRAP_ADMIN_NAME:-MOVE Admin}
      PORT: "3001"
    depends_on:
      - postgres

  traslados-service:
    build:
      context: .
      dockerfile: traslados-service/Dockerfile
      target: dev
    ports:
      - "${TRASLADOS_SERVICE_PORT:-3002}:3002"
    volumes:
      - ./traslados-service/src:/app/traslados-service/src
    environment:
      NODE_ENV: development
      DATABASE_URL: ${DATABASE_URL:-postgres://move:move_secret@postgres:5432/move_platform}
      PORT: "3002"
    depends_on:
      - postgres

  categorizer-service:
    build:
      context: .
      dockerfile: categorizer-service/Dockerfile
      target: dev
    ports:
      - "${CATEGORIZER_SERVICE_PORT:-3003}:3003"
    volumes:
      - ./categorizer-service/src:/app/categorizer-service/src
    environment:
      NODE_ENV: development
      DATABASE_URL: ${DATABASE_URL:-postgres://move:move_secret@postgres:5432/move_platform}
      PORT: "3003"
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
    depends_on:
      - postgres
      - ollama

  gps-simulator:
    build:
      context: .
      dockerfile: traslados-service/simulator/Dockerfile
      target: dev
    environment:
      NODE_ENV: development
      TRASLADOS_SERVICE_URL: ${TRASLADOS_SERVICE_URL:-http://traslados-service:3002}
      INTERVAL_MS: ${GPS_SIMULATOR_INTERVAL_MS:-2000}
    depends_on:
      - traslados-service

  ollama:
    image: ollama/ollama:latest
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_data_dev:/root/.ollama

volumes:
  pg_data_dev:
  ollama_data_dev:
