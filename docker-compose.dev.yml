version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: move
      POSTGRES_PASSWORD: move_secret
      POSTGRES_DB: move_platform
    ports:
      - "5432:5432"
    volumes:
      - pg_data_dev:/var/lib/postgresql/data

  api-gateway:
    build:
      context: ./api-gateway
      target: dev
    ports:
      - "3000:3000"
    volumes:
      - ./api-gateway/src:/app/src
    environment:
      NODE_ENV: development
      RESERVAS_SERVICE_URL: http://reservas-service:3001
      TRASLADOS_SERVICE_URL: http://traslados-service:3002
    depends_on:
      - reservas-service
      - traslados-service

  reservas-service:
    build:
      context: ./reservas-service
      target: dev
    ports:
      - "3001:3001"
    volumes:
      - ./reservas-service/src:/app/src
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://move:move_secret@postgres:5432/move_platform
      PORT: "3001"
    depends_on:
      - postgres

  traslados-service:
    build:
      context: ./traslados-service
      target: dev
    ports:
      - "3002:3002"
    volumes:
      - ./traslados-service/src:/app/src
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://move:move_secret@postgres:5432/move_platform
      PORT: "3002"
    depends_on:
      - postgres
      - gps-simulator

  categorizer-service:
    build:
      context: ./categorizer-service
      target: dev
    ports:
      - "3003:3003"
    volumes:
      - ./categorizer-service/src:/app/src
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://move:move_secret@postgres:5432/move_platform
      PORT: "3003"
      OLLAMA_URL: http://ollama:11434
    depends_on:
      - postgres
      - ollama

  gps-simulator:
    build: ./traslados-service/simulator
    environment:
      NODE_ENV: development
      TRASLADOS_SERVICE_URL: http://traslados-service:3002
      INTERVAL_MS: "2000"
    depends_on:
      - traslados-service

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data_dev:/root/.ollama

volumes:
  pg_data_dev:
  ollama_data_dev:
