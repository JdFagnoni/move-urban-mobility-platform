name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # ── 1. Lint & format ───────────────────────────────────────────────────────
  lint-and-format:
    name: Lint & Format
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: ESLint (Node.js coding conventions)
        run: npm run lint

      - name: Prettier (format check)
        run: npm run format:check

  # ── 2. TypeScript build ────────────────────────────────────────────────────
  build:
    name: TypeScript Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build all workspaces
        run: npm run build

  # ── 3. Docker build & health check ────────────────────────────────────────
  docker:
    name: Docker Build & Health Check
    runs-on: ubuntu-latest
    needs: [lint-and-format, build]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build images
        run: docker compose -f docker-compose.ci.yml build --parallel

      - name: Start services
        run: docker compose -f docker-compose.ci.yml up -d

      - name: Wait for services to be healthy
        run: |
          echo "Waiting for services..."
          for i in $(seq 1 20); do
            sleep 3
            echo "Attempt $i/20"
            OK=true

            curl -sf http://localhost:3000/health || OK=false
            curl -sf http://localhost:3001/health || OK=false
            curl -sf http://localhost:3002/health || OK=false
            curl -sf http://localhost:3003/health || OK=false

            if [ "$OK" = "true" ]; then
              echo "All services healthy"
              exit 0
            fi
          done
          echo "Services did not become healthy in time"
          docker compose -f docker-compose.ci.yml logs
          exit 1

      - name: Print service logs on failure
        if: failure()
        run: docker compose -f docker-compose.ci.yml logs

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.ci.yml down -v
